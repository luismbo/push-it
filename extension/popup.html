<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Push It</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <div class="title-row">
          <img src="icon128.png" alt="" class="icon" />
          <div>
            <h1>Push It</h1>
            <div class="status-row">
              <span id="statusDot" class="dot"></span>
              <span id="statusText">Not paired</span>
            </div>
          </div>
        </div>
        <div class="header-actions">
          <button id="devicePill" class="device-pill" title="Settings"></button>
          <button id="toggleSettings" class="btn secondary small">Settings</button>
        </div>
      </header>

      <div id="toast" class="toast hidden"></div>

      <section id="settingsView" class="settings-view hidden">
        <div class="card">
          <div class="toggle">
            <strong id="devicesHeading">Devices</strong>
            <button id="togglePairBtn" class="btn primary small">+ Pair</button>
          </div>
          <div id="deviceList" class="device-list"></div>
          <div id="pairBox" class="pair-box hidden">
            <label class="label" for="pairInput">Paste pair link from Push It</label>
            <input id="pairInput" type="text" placeholder="Paste pair link here..." />
            <button id="savePair" class="btn primary">Save &amp; Connect</button>
          </div>
        </div>

        <div class="card">
          <label class="toggle">
            <span>Auto-open incoming links</span>
            <input id="autoOpen" type="checkbox" checked />
          </label>
        </div>

        <div class="card">
          <div class="toggle">
            <span>Chat history</span>
            <button id="clearBtn" class="btn secondary small">Clear</button>
          </div>
        </div>

        <div class="version-footer">
          <span id="versionText"></span>
          <span id="updateHint" class="update-pill hidden"></span>
        </div>
      </section>

      <section id="chatView" class="chat-view">
        <div id="historyList" class="history"></div>

        <div id="targetBar" class="target-bar hidden"></div>

        <footer class="composer-area">
          <button id="sendTab" class="tab-bar-btn" title="Push the active browser tab">
            <span class="tab-bar-icon">↗</span>
            <span id="sendTabLabel" class="tab-bar-text">Push This Tab</span>
          </button>

          <div class="input-box">
            <input id="fileInput" type="file" class="hidden" />
            <button id="attachBtn" class="icon-action" title="Attach photo or file">+</button>
            <textarea
              id="draft"
              rows="1"
              placeholder="Write a note, paste a link or screenshot..."
            ></textarea>
            <button id="sendDraft" class="send-btn" title="Push It" aria-label="Push It">
              <svg class="send-icon" viewBox="105 96 340 340" aria-hidden="true">
                <path class="plane" d="M124 268l256-124-76 264-58-82-122-58z" />
                <path class="fold" d="M246 326l134-182-164 148 30 34z" />
              </svg>
            </button>
          </div>
        </footer>
      </section>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
